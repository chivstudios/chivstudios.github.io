<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHIV Studios</title>
<meta name="description" content="CHIV Studios makes cute, relaxing mobile games. Our first game: Bounceverse.">
<style>
  :root { --ink:#14183a; --sky:#5ab4f5; --sun:#ffd23f; --cream:#fff7e6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
         background:linear-gradient(#5ab4f5,#d6f3ff 70%); min-height:100vh; }
  main { max-width:720px; margin:0 auto; padding:56px 20px 40px; }
  h1 { font-size:44px; margin:0 0 6px; letter-spacing:.5px; color:#fff; text-shadow:0 3px 0 var(--ink); }
  .tag { margin:0 0 36px; font-size:18px; color:var(--ink); }
  .card { background:var(--cream); border:4px solid var(--ink); border-radius:22px; padding:26px;
          box-shadow:0 8px 0 var(--ink); }
  .card h2 { margin:0 0 8px; font-size:30px; }
  .card p { margin:0 0 20px; line-height:1.5; font-size:17px; }
  .btn { display:inline-block; background:var(--sun); color:var(--ink); font-weight:800; text-decoration:none;
         padding:14px 22px; border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); }
  footer { margin-top:40px; font-size:15px; line-height:1.7; }
  footer a { color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1>CHIV Studios</h1>
  <p class="tag">Cute, relaxing mobile games.</p>

  <section class="card">
    <h2>Bounceverse</h2>
    <p>Tap to bounce a cuddly creature through 12 dreamy sky worlds. Collect donuts, unlock 13 creatures with their own powers, and fly as far as you can.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.chivstudios.bounceverse">Get it on Google Play</a>
  </section>

  <footer>
    Contact: <a href="mailto:chivstudios.help@outlook.com">chivstudios.help@outlook.com</a><br>
    &copy; 2026 CHIV Studios
  </footer>
</main>
</body>
</html>
